<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SillyTavern-SheepBlock - 酒馆小游戏中心 (主页/羊了个羊/俄罗斯方块/暂停/存档)</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111827;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    .demo-tavern-container {
      max-width: 520px;
      width: 90%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .demo-tavern-title {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .demo-tavern-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .demo-btn-open {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s;
    }

    .demo-btn-open:hover { transform: scale(1.04); }
    .demo-btn-open:active { transform: scale(0.96); }

    .demo-shortcut-tag {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .demo-shortcut-tag kbd {
      background: #334155;
      padding: 2px 5px;
      border-radius: 4px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="demo-tavern-container">
    <div class="demo-tavern-title">🎮 SheepBlock 独立运行测试器</div>
    <p class="demo-tavern-desc">
      ✨ <b>全新功能升级已生效</b>：<br>
      1. 🏠 <b>独立主页选择大厅</b>，支持在主页自由挑选游戏，随时按返回键换游戏；<br>
      2. 🐑 <b>羊了个羊手机端道具栏全显</b>，卡牌舞台弹性自适应缩放；<br>
      3. ⏸ <b>双游戏全面支持暂停</b>；<br>
      4. 💾 <b>全量进度自动保存</b>，关掉页面重开不丢牌局！
    </p>
    <button class="demo-btn-open" onclick="window.sillyGamePlus.openModal()">
      打开游戏大厅
    </button>
    <br>
    <div class="demo-shortcut-tag">
      或者点击屏幕右侧悬浮手柄，或按键盘 <kbd>Alt</kbd> + <kbd>G</kbd>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
