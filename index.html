<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Silly Game Plus - 酒馆小游戏中心 (羊了个羊 & 俄罗斯方块)</title>
  <!-- 引入插件专属样式 -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* 模拟 SillyTavern 酒馆深色背景与测试环境 */
    body {
      margin: 0;
      padding: 0;
      background: #111827;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    .demo-tavern-container {
      max-width: 600px;
      width: 90%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .demo-tavern-title {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .demo-tavern-desc {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .demo-btn-open {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s;
    }

    .demo-btn-open:hover {
      transform: scale(1.05);
    }

    .demo-btn-open:active {
      transform: scale(0.96);
    }

    .demo-shortcut-tag {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .demo-shortcut-tag kbd {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 模拟酒馆测试主界面 -->
  <div class="demo-tavern-container">
    <div class="demo-tavern-title">🎮 Silly Game Plus 扩展演示</div>
    <p class="demo-tavern-desc">
      已成功加载 SillyTavern 风格插件系统！包含：<br>
      🐑 <b>羊了个羊 (爽玩增强版)</b>：道具各 5 次 + 无限补充 + 5 格暂存区<br>
      🧱 <b>现代俄罗斯方块 (Tetris)</b>：7-Bag 竞技发牌 + 幽灵落点投影 + 手机触屏虚拟手柄
    </p>
    <button class="demo-btn-open" onclick="window.sillyGamePlus.openModal()">
      打开小游戏中心
    </button>
    <br>
    <div class="demo-shortcut-tag">
      或者点击右下角悬浮球，或按键盘 <kbd>Alt</kbd> + <kbd>G</kbd>
    </div>
  </div>

  <!-- 引入插件核心代码 -->
  <script src="index.js"></script>
</body>
</html>
